<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>키오스크 연습기</title>
<style>
  :root{
    --shell-bg:#14161a;
    --shell-panel:#1e2229;
    --shell-line:#333a44;
    --shell-text:#f2f4f7;
    --shell-dim:#9aa4b2;
    --practice:#ffc53d;
    --ok:#3ddc84;
    --radius:14px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--shell-bg);
    color:var(--shell-text);
    font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;
    font-size:clamp(18px,1.9vw,21px);
    line-height:1.45;
    -webkit-text-size-adjust:100%;
    overflow-x:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;}

  /* ---------- 연습 프레임 ---------- */
  .shell{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }
  .bar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;
    background:var(--shell-panel);
    border-bottom:1px solid var(--shell-line);
    flex-wrap:wrap;
  }
  .tag{
    font-size:.8em;font-weight:800;letter-spacing:.08em;
    color:#14161a;background:var(--practice);
    padding:6px 11px;border-radius:999px;white-space:nowrap;
  }
  .mission{
    flex:1 1 240px;min-width:0;
    font-size:1em;color:var(--shell-text);
  }
  .mission b{color:var(--practice);font-weight:800;}
  .bar-btns{display:flex;gap:8px;flex:0 0 auto;}
  .bar-btn{
    border:2px solid var(--shell-line);
    background:#262b33;color:var(--shell-text);
    min-height:56px;padding:0 18px;border-radius:12px;
    font-size:1em;font-weight:800;white-space:nowrap;
  }
  .bar-btn:active{transform:scale(.95);}
  .bar-btn.on{background:var(--practice);color:#14161a;border-color:var(--practice);}
  .bar-btn:disabled{opacity:.35;}

  .stage{
    flex:1;
    display:flex;align-items:stretch;justify-content:center;
    padding:0;
  }

  /* ---------- 기계 화면 ---------- */
  .kiosk{
    width:100%;
    display:flex;flex-direction:column;
    background:var(--k-bg);
    color:var(--k-text);
    position:relative;
    overflow:hidden;
  }
  .kiosk[data-theme="cafe"]{--k-bg:#33241c;--k-text:#fbf4e8;--k-card:#452f24;--k-line:#5d4133;--k-accent:#d2712f;--k-accent-text:#fff;--k-sub:#e0cdba;}
  .kiosk[data-theme="clinic"]{--k-bg:#ffffff;--k-text:#0f2c52;--k-card:#f1f6fc;--k-line:#c8dcf2;--k-accent:#1668c4;--k-accent-text:#fff;--k-sub:#3d5c80;}
  .kiosk[data-theme="gov"]{--k-bg:#f3f5f1;--k-text:#173d2c;--k-card:#ffffff;--k-line:#c2d2c8;--k-accent:#166b46;--k-accent-text:#fff;--k-sub:#41604f;}
  .kiosk[data-theme="home"]{--k-bg:#14161a;--k-text:#f2f4f7;--k-card:#1e2229;--k-line:#333a44;--k-accent:#ffc53d;--k-accent-text:#14161a;--k-sub:#9aa4b2;}

  .k-head{
    padding:16px 20px;
    border-bottom:2px solid var(--k-line);
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  }
  .k-brand{font-size:1.05em;font-weight:800;letter-spacing:-.01em;}
  .k-step{margin-left:auto;font-size:.92em;color:var(--k-sub);font-weight:700;}

  .k-body{
    flex:1;
    padding:clamp(18px,3vw,34px) clamp(16px,4vw,40px) 24px;
    display:flex;flex-direction:column;
    max-width:1000px;width:100%;margin:0 auto;
  }
  .k-title{
    font-size:clamp(26px,4.2vw,44px);
    font-weight:800;line-height:1.25;letter-spacing:-.02em;
    margin:0 0 8px;
  }
  .k-sub{
    font-size:clamp(18px,2vw,22px);
    color:var(--k-sub);margin:0 0 clamp(16px,2.5vw,26px);
  }

  .opts{display:grid;gap:12px;grid-template-columns:1fr;}
  .opts.two{grid-template-columns:1fr;}
  @media (min-width:640px){
    .opts.two{grid-template-columns:1fr 1fr;}
    .opts.grid{grid-template-columns:1fr 1fr;}
  }

  .opt{
    display:flex;align-items:center;gap:14px;
    width:100%;min-height:84px;
    padding:16px 20px;
    background:var(--k-card);
    border:2px solid var(--k-line);
    border-radius:var(--radius);
    text-align:left;
    transition:transform .08s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .opt:active{transform:scale(.96);border-color:var(--k-accent);}
  .opt-main{flex:1;min-width:0;}
  .opt-label{font-size:clamp(21px,2.6vw,28px);font-weight:800;letter-spacing:-.01em;display:block;}
  .opt-note{font-size:clamp(17px,1.7vw,19px);color:var(--k-sub);margin-top:3px;display:block;}
  .opt-price{font-size:clamp(19px,2.1vw,23px);font-weight:800;white-space:nowrap;}
  .opt.primary{background:var(--k-accent);border-color:var(--k-accent);color:var(--k-accent-text);}
  .opt.primary .opt-note{color:var(--k-accent-text);opacity:.9;}
  .opt.ghost{background:transparent;}

  /* 도움말: 눌러야 할 곳만 밝게 */
  .kiosk.help .opt:not(.hint),
  .kiosk.help .key:not(.hint),
  .kiosk.help .finger button:not(.hint),
  .kiosk.help .cardslot:not(.hint){opacity:.28;}
  .kiosk.help .opt.hint,
  .kiosk.help .key.hint,
  .kiosk.help .finger button.hint,
  .kiosk.help .cardslot.hint,
  .kiosk.help .touch.hint{
    box-shadow:0 0 0 5px var(--practice);
    position:relative;
  }
  .kiosk.help .opt.hint::after,
  .kiosk.help .key.hint::after,
  .kiosk.help .finger button.hint::after,
  .kiosk.help .cardslot.hint::after,
  .kiosk.help .touch.hint::after{
    content:'여기';
    position:absolute;right:-6px;top:-14px;
    background:var(--practice);color:#14161a;
    font-size:15px;font-weight:800;
    padding:3px 10px;border-radius:999px;
  }
  @media (prefers-reduced-motion:no-preference){
    .kiosk.help .opt.hint,
    .kiosk.help .key.hint,
    .kiosk.help .cardslot.hint{animation:pulse 1.6s ease-in-out infinite;}
    @keyframes pulse{
      0%,100%{box-shadow:0 0 0 5px var(--practice);}
      50%{box-shadow:0 0 0 10px rgba(255,197,61,.45);}
    }
  }

  /* 시작 화면 */
  .attract{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    text-align:center;padding:30px 10px;
  }
  .attract-title{font-size:clamp(30px,6vw,60px);font-weight:800;letter-spacing:-.03em;}
  .attract-sub{font-size:clamp(18px,2.4vw,26px);color:var(--k-sub);}
  .touch{
    margin-top:10px;
    width:clamp(150px,26vw,220px);height:clamp(150px,26vw,220px);
    border-radius:50%;
    border:5px dashed var(--k-accent);
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(20px,2.6vw,28px);font-weight:800;color:var(--k-accent);
  }
  @media (prefers-reduced-motion:no-preference){
    .touch{animation:breathe 2.4s ease-in-out infinite;}
    @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  }

  /* 숫자판 */
  .display{
    background:var(--k-card);border:2px solid var(--k-line);
    border-radius:var(--radius);
    padding:18px;margin-bottom:14px;
    font-size:clamp(28px,5vw,44px);font-weight:800;
    letter-spacing:.14em;text-align:center;min-height:82px;
    word-break:break-all;
  }
  .display .ph{color:var(--k-sub);letter-spacing:.1em;font-size:.62em;}
  .display.shake{animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-9px);}75%{transform:translateX(9px);}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .key{
    min-height:72px;
    background:var(--k-card);border:2px solid var(--k-line);
    border-radius:var(--radius);
    font-size:clamp(25px,3.4vw,32px);font-weight:800;
    transition:transform .08s ease;
  }
  .key:active{transform:scale(.94);}
  .key.act{background:var(--k-accent);border-color:var(--k-accent);color:var(--k-accent-text);font-size:clamp(19px,2.2vw,24px);}
  .key:disabled{opacity:.4;}

  /* 연습번호 안내 */
  .practice-num{
    background:var(--k-card);border:2px dashed var(--k-accent);
    border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;
  }
  .practice-num .pn-label{font-size:clamp(16px,1.8vw,19px);color:var(--k-sub);}
  .practice-num .pn-value{
    font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:.12em;
    color:var(--k-accent);margin-top:4px;
  }
  .practice-num .pn-warn{font-size:clamp(16px,1.8vw,19px);margin-top:8px;font-weight:700;}

  /* 지문 */
  .finger{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:20px 0;
  }
  .finger button{
    width:clamp(170px,30vw,240px);height:clamp(170px,30vw,240px);
    border-radius:28px;
    border:5px solid var(--k-accent);background:var(--k-card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    font-size:clamp(19px,2.2vw,24px);font-weight:800;color:var(--k-accent);
  }
  .finger button:active{transform:scale(.96);}
  .finger .ring{
    width:64px;height:64px;border-radius:50%;
    border:5px solid var(--k-accent);border-top-color:transparent;
  }

  /* 카드 투입구 */
  .cardwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
  .cardslot{
    width:min(420px,92%);
    background:var(--k-card);border:3px solid var(--k-accent);
    border-radius:20px;padding:26px 22px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .cardslot:active{transform:scale(.97);}
  .slot-line{
    width:80%;height:16px;border-radius:8px;
    background:var(--k-bg);border:2px solid var(--k-accent);
  }
  .slot-arrow{font-size:38px;line-height:1;color:var(--k-accent);}
  @media (prefers-reduced-motion:no-preference){
    .slot-arrow{animation:down 1.4s ease-in-out infinite;}
    @keyframes down{0%,100%{transform:translateY(-5px);}50%{transform:translateY(5px);}}
  }
  .slot-text{font-size:clamp(19px,2.2vw,24px);font-weight:800;text-align:center;}

  /* 진행중 */
  .waiting{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;text-align:center;
  }
  .bars{display:flex;gap:8px;}
  .bars i{width:14px;height:44px;background:var(--k-accent);border-radius:5px;opacity:.3;}
  @media (prefers-reduced-motion:no-preference){
    .bars i{animation:bounce 1s ease-in-out infinite;}
    .bars i:nth-child(2){animation-delay:.15s;}
    .bars i:nth-child(3){animation-delay:.3s;}
    .bars i:nth-child(4){animation-delay:.45s;}
    @keyframes bounce{0%,100%{opacity:.3;transform:scaleY(.7);}50%{opacity:1;transform:scaleY(1.15);}}
  }

  /* 완료 */
  .done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;}
  .ticket{
    background:var(--k-card);border:3px solid var(--k-accent);
    border-radius:20px;padding:clamp(18px,3.4vw,30px) clamp(26px,6vw,58px);
  }
  .ticket-label{font-size:clamp(18px,2vw,21px);color:var(--k-sub);margin-bottom:6px;}
  .ticket-num{font-size:clamp(44px,9vw,80px);font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--k-accent);}
  .done-msg{font-size:clamp(19px,2.4vw,26px);font-weight:700;max-width:22em;margin:0;}
  .done-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
  .done-btns .opt{width:auto;min-height:68px;}

  /* 미션 채점 */
  .verdict{
    width:min(560px,100%);
    border-radius:18px;padding:18px 20px;
    border:3px solid var(--k-line);background:var(--k-card);
    text-align:left;
  }
  .verdict.pass{border-color:var(--ok);}
  .verdict.near{border-color:var(--practice);}
  .v-head{font-size:clamp(22px,2.8vw,28px);font-weight:800;margin-bottom:10px;text-align:center;}
  .verdict.pass .v-head{color:var(--ok);}
  .verdict.near .v-head{color:var(--practice);}
  .v-item{
    display:flex;gap:10px;align-items:flex-start;
    padding:9px 0;border-top:1px solid var(--k-line);
    font-size:clamp(18px,2vw,21px);
  }
  .v-item:first-of-type{border-top:0;}
  .v-mark{flex:0 0 auto;font-weight:800;}
  .v-item.no .v-mark{color:var(--practice);}
  .v-item.yes .v-mark{color:var(--ok);}

  /* AI 물어보기 */
  .askbar{margin-top:18px;display:flex;justify-content:center;}
  .askbtn{
    border:2px dashed var(--k-line);color:var(--k-sub);
    background:transparent;border-radius:999px;
    min-height:56px;padding:0 22px;
    font-size:clamp(17px,1.9vw,20px);font-weight:700;
  }
  .askbtn:active{transform:scale(.96);}

  .sheet{
    position:fixed;inset:0;z-index:50;
    background:rgba(0,0,0,.72);
    display:none;align-items:flex-end;justify-content:center;
  }
  .sheet.on{display:flex;}
  .sheet-in{
    width:min(680px,100%);
    background:var(--shell-panel);color:var(--shell-text);
    border-radius:22px 22px 0 0;
    border-top:3px solid var(--practice);
    padding:22px 20px 26px;
    max-height:88vh;overflow:auto;
  }
  .sheet-title{font-size:clamp(21px,2.6vw,26px);font-weight:800;margin:0 0 6px;}
  .sheet-lead{font-size:clamp(17px,1.9vw,20px);color:var(--shell-dim);margin:0 0 16px;}
  .prompt{
    background:#14161a;border:2px solid var(--shell-line);border-radius:14px;
    padding:16px 18px;font-size:clamp(19px,2.2vw,23px);line-height:1.6;
    font-weight:700;white-space:pre-wrap;
    user-select:text;-webkit-user-select:text;
  }
  .sheet-steps{margin:16px 0 0;padding-left:22px;font-size:clamp(17px,1.9vw,20px);color:var(--shell-dim);}
  .sheet-steps li{margin-bottom:6px;}
  .sheet-btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .sheet-btns button{
    flex:1 1 140px;min-height:60px;border-radius:14px;
    font-size:clamp(18px,2vw,21px);font-weight:800;
  }
  .btn-copy{background:var(--practice);color:#14161a;}
  .btn-close{background:#262b33;color:var(--shell-text);border:2px solid var(--shell-line);}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--practice);color:#14161a;
    padding:14px 22px;border-radius:999px;
    font-size:19px;font-weight:800;z-index:60;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .toast.on{opacity:1;}

  /* 확인표 */
  .lines{
    background:var(--k-card);border:2px solid var(--k-line);
    border-radius:var(--radius);overflow:hidden;margin-bottom:18px;
  }
  .line{
    display:flex;justify-content:space-between;gap:14px;
    padding:15px 18px;border-bottom:1px solid var(--k-line);
    font-size:clamp(19px,2.1vw,23px);
  }
  .line:last-child{border-bottom:0;}
  .line span:first-child{color:var(--k-sub);}
  .line span:last-child{font-weight:800;text-align:right;}
  .line.total span{font-size:clamp(21px,2.4vw,26px);font-weight:800;color:var(--k-text);}

  /* 홈 */
  .home-head{padding:clamp(22px,4vw,38px) clamp(16px,4vw,40px) 6px;max-width:1000px;margin:0 auto;width:100%;}
  .home-title{font-size:clamp(27px,4.4vw,42px);font-weight:800;letter-spacing:-.02em;margin:0 0 8px;}
  .home-sub{font-size:clamp(18px,2vw,21px);color:var(--shell-dim);margin:0;}
  .machines{display:grid;gap:14px;grid-template-columns:1fr;}
  @media (min-width:820px){.machines{grid-template-columns:repeat(3,1fr);}}
  .machine{
    padding:22px;border-radius:18px;border:2px solid var(--shell-line);
    background:var(--shell-panel);text-align:left;
    display:flex;flex-direction:column;gap:8px;min-height:150px;
  }
  .machine:active{transform:scale(.98);border-color:var(--practice);}
  .m-kind{font-size:.85em;font-weight:800;letter-spacing:.1em;color:var(--practice);}
  .m-name{font-size:clamp(22px,2.8vw,28px);font-weight:800;}
  .m-goal{font-size:clamp(17px,1.8vw,19px);color:var(--shell-dim);}
  .note{
    margin-top:18px;padding:16px 18px;border-radius:14px;
    border:1px dashed var(--shell-line);color:var(--shell-dim);
    font-size:clamp(17px,1.7vw,19px);
  }
  .note b{color:var(--shell-text);}

  :focus-visible{outline:4px solid var(--practice);outline-offset:3px;}
</style>
</head>
<body>
<div class="shell">
  <div class="bar">
    <span class="tag">연습용</span>
    <div class="mission" id="mission">기계를 하나 고르세요</div>
    <div class="bar-btns">
      <button class="bar-btn" id="btnHelp" disabled>도움말</button>
      <button class="bar-btn" id="btnBack" disabled>뒤로</button>
      <button class="bar-btn" id="btnHome">처음으로</button>
    </div>
  </div>
  <div class="stage"><div class="kiosk" id="kiosk" data-theme="home"></div></div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-in">
    <h3 class="sheet-title">이 화면을 AI에게 물어보기</h3>
    <p class="sheet-lead">스마트폰으로 이 화면을 찍고, 아래 문장을 그대로 말하거나 붙여넣으세요.</p>
    <div class="prompt" id="promptBox"></div>
    <ol class="sheet-steps">
      <li>스마트폰으로 이 화면을 사진 찍기</li>
      <li>Gemini를 열고 사진 넣기</li>
      <li>아래 문장을 말하거나 붙여넣기</li>
    </ol>
    <div class="sheet-btns">
      <button class="btn-copy" id="btnCopy">문장 복사하기</button>
      <button class="btn-close" id="btnCloseSheet">닫기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FLOWS = {
  cafe: {
    kind: '카페',
    brand: '햇살카페 주문기',
    name: '카페 음료 주문',
    theme: 'cafe',
    goal: '아이스 아메리카노 1잔을 포장으로 주문하고 카드로 결제하기',
    mission: '<b>아이스 아메리카노 1잔</b>을 <b>포장</b>으로 주문하고 <b>카드</b>로 결제하세요',
    start: 'c0',
    steps: 9,
    review: st => {
      const cart = st.cart || [];
      const one = cart.length === 1 && cart[0].name === '아이스 아메리카노';
      return [
        [st.dine === '포장', st.dine === '포장'
          ? '포장으로 잘 고르셨어요'
          : '매장에서 먹기로 되어 있어요. 미션은 포장이었어요'],
        [one, one
          ? '아이스 아메리카노 1잔, 정확합니다'
          : (cart.length === 0 ? '담은 음료가 없어요'
             : cart.length > 1 ? cart.length + '잔이 담겼어요. 미션은 1잔이었어요'
             : '고르신 음료는 ' + cart[0].name + '이에요. 미션은 아이스 아메리카노였어요')],
        [st.pay === '카드', st.pay === '카드'

      g5: { kind:'choice', step:5, title:'주소를 어떻게 표시할까요?', sub:'대부분 현재 주소만으로 충분합니다',
            ask:'이 화면에서 현재 주소만 나오게 하려면 어느 버튼을 눌러야 해?',
            opts:[ {label:'현재 주소만 표시', note:'가장 많이 쓰는 방법', next:'g6', set:{addr:'현재'}, hint:true},
                   {label:'지난 주소까지 모두 표시', note:'이사한 기록이 다 나옵니다', next:'g6', set:{addr:'전체'}} ] },
      g6: { kind:'choice', step:6, title:'몇 통 뽑으시겠어요?', sub:'한 통에 200원입니다',
            opts:[ {label:'1통', note:'200원', next:'g7', set:{copies:1}, hint:true},
                   {label:'2통', note:'400원', next:'g7', set:{copies:2}},
                   {label:'3통', note:'600원', next:'g7', set:{copies:3}} ] },
      g7: { kind:'confirm', step:7, title:'이 내용이 맞습니까?', sub:'맞으면 결제하기를 눌러주세요',
            ask:'이 확인 화면을 읽어주고, 결제하려면 어디를 눌러야 하는지 알려줘.',
            lines: st => [ ['서류', st.doc || '주민등록등본'], ['주소 표시', st.addr === '전체' ? '지난 주소까지' : '현재 주소만'],
                           ['통수', (st.copies || 1) + '통'], ['수수료', ((st.copies || 1) * 200).toLocaleString() + '원'] ],
            opts:[ {label:'통수 바꾸기', next:'g6', ghost:true},
                   {label:'결제하기', next:'g8', primary:true, hint:true} ] },
      g8: { kind:'choice', step:8, title:'수수료를 내주세요', sub:'',
            ask:'이 화면에서 카드로 수수료를 내려고 해. 어느 버튼이야?',
            opts:[ {label:'카드', note:'투입구에 끝까지 넣어주세요', next:'g8b', set:{pay:'카드'}, hint:true},
                   {label:'동전', note:'동전 투입구에 넣어주세요', next:'g9', set:{pay:'동전'}} ] },
      g8b: { kind:'card', step:8, title:'카드를 넣어주세요',
            sub:'끝까지 넣은 다음, 아래를 한 번 눌러주세요', next:'g9' },
      g9: { kind:'wait', step:9, title:'서류를 뽑고 있습니다', sub:'종이가 나올 때까지 기다려주세요', next:'g10', ms:2400 },
      g10: { kind:'done', step:10, label:'발급 완료', num: st => (st.copies || 1) + '통',
            msg: st => (st.doc || '주민등록등본') + '이 나왔습니다.\n아래 출구에서 가져가세요.' }
    }
  }
};

const kiosk = document.getElementById('kiosk');
const missionEl = document.getElementById('mission');
const btnHelp = document.getElementById('btnHelp');
const btnBack = document.getElementById('btnBack');
const btnHome = document.getElementById('btnHome');
const sheet = document.getElementById('sheet');
const promptBox = document.getElementById('promptBox');
const toastEl = document.getElementById('toast');

let flowKey = null, cur = null, stack = [], help = false, typed = '', timer = null, state = {};

/* ---------- 소리 ---------- */
let ac = null;
function beep(freq){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.value = freq || 880;
    g.gain.setValueAtTime(.07, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .09);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + .1);
  }catch(e){}
}
document.addEventListener('pointerdown', e => {
  if(e.target.closest('button, .attract, .machine')) beep();
}, true);

/* ---------- 도구 ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }
function nx(v){ return typeof v === 'function' ? v(state) : v; }
function clearTimer(){ if(timer){ clearTimeout(timer); timer = null; } }
function snap(){ return JSON.parse(JSON.stringify(state)); }

let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1800);
}

/* ---------- 화면 이동 ---------- */
function go(id, push = true, before = null){
  clearTimer();
  if(push && cur) stack.push({ id: cur, st: before || snap() });
  cur = id; typed = '';
  render();
}

function home(){
  clearTimer();
  flowKey = null; cur = null; stack = []; help = false; typed = ''; state = {};
  kiosk.dataset.theme = 'home';
  kiosk.classList.remove('help');
  missionEl.innerHTML = '기계를 하나 고르세요';
  btnHelp.disabled = true; btnHelp.classList.remove('on');
  btnBack.disabled = true;
  renderHome();
}

function renderHome(){
  const cards = Object.keys(FLOWS).map(k => {
    const f = FLOWS[k];
    return `<button class="machine" data-flow="${k}">
      <span class="m-kind">${esc(f.kind)}</span>
      <span class="m-name">${esc(f.name)}</span>
      <span class="m-goal">${esc(f.goal)}</span>
    </button>`;
  }).join('');

  kiosk.innerHTML = `
    <div class="home-head">
      <h1 class="home-title">키오스크 연습기</h1>
      <p class="home-sub">진짜 기계가 아닙니다. 마음껏 눌러보세요.</p>
    </div>
    <div class="k-body">
      <div class="machines">${cards}</div>
      <div class="note">
        <b>막히면 위쪽 도움말</b>을 누르세요. 눌러야 할 곳만 밝게 보입니다.<br>
        기계마다 화면이 다릅니다. 그래서 <b>모르는 화면은 사진을 찍어 AI에게 물어보는 것</b>이 가장 빠릅니다.<br>
        화면 아래 <b>“이 화면 AI에게 물어보기”</b>를 누르면 물어볼 문장이 나옵니다.
      </div>
    </div>`;

  kiosk.querySelectorAll('[data-flow]').forEach(b => {
    b.onclick = () => startFlow(b.dataset.flow);
  });
}

function startFlow(key){
  flowKey = key;
  const f = FLOWS[key];
  stack = []; cur = null; help = false; state = {};
  kiosk.dataset.theme = f.theme;
  kiosk.classList.remove('help');
  missionEl.innerHTML = f.mission;
  btnHelp.disabled = false; btnHelp.classList.remove('on');
  go(f.start, false);
}

function optHTML(o, i){
  const cls = ['opt'];
  if(o.primary) cls.push('primary');
  if(o.ghost) cls.push('ghost');
  if(o.hint) cls.push('hint');
  return `<button class="${cls.join(' ')}" data-next="${o.next}" data-i="${i}">
    <span class="opt-main">
      <span class="opt-label">${esc(o.label)}</span>
      ${o.note ? `<span class="opt-note">${esc(o.note)}</span>` : ''}
    </span>
    ${o.price ? `<span class="opt-price">${esc(o.price)}</span>` : ''}
  </button>`;
}

function askHTML(s, f){
  const q = s.ask || ('이 키오스크 화면에서 ' + f.goal + '을(를) 하려고 해.\n다음에 눌러야 할 버튼을 한 단계씩 쉽게 알려줘.');
  return `<div class="askbar">
    <button class="askbtn" data-ask="${esc(q)}">📷 이 화면 AI에게 물어보기</button>
  </div>`;
}

function render(){
  const f = FLOWS[flowKey];
  const s = f.screens[cur];
  const step = s.step || 0;
  const total = f.steps || 0;

  btnBack.disabled = stack.length === 0;

  let head = `<div class="k-head">
    <span class="k-brand">${esc(f.brand)}</span>
    <span class="k-step">${total ? step + ' / ' + total + ' 단계' : ''}</span>
  </div>`;

  let body = '';
  let showAsk = true;

  if(s.kind === 'attract'){
    head = '';
    body = `<div class="attract">
      <div class="attract-title">${nl(s.title)}</div>
      <div class="attract-sub">${esc(s.sub || '')}</div>
      <div class="touch${help ? ' hint' : ''}">누르기</div>
    </div>`;
  }

  else if(s.kind === 'choice'){
    const cols = s.opts.length === 2 ? 'two' : (s.cols || '');
    body = `<h2 class="k-title">${nl(s.title)}</h2>
      ${s.sub ? `<p class="k-sub">${esc(s.sub)}</p>` : ''}
      <div class="opts ${cols}">${s.opts.map(optHTML).join('')}</div>`;
  }

  else if(s.kind === 'confirm'){
    const lines = typeof s.lines === 'function' ? s.lines(state) : s.lines;
    body = `<h2 class="k-title">${nl(s.title)}</h2>
      ${s.sub ? `<p class="k-sub">${esc(s.sub)}</p>` : ''}
      <div class="lines">${lines.map((l, i) =>
        `<div class="line${i === lines.length - 1 ? ' total' : ''}"><span>${esc(l[0])}</span><span>${esc(l[1])}</span></div>`
      ).join('')}</div>
      <div class="opts ${s.opts.length === 2 ? 'two' : ''}">${s.opts.map(optHTML).join('')}</div>`;
  }

  else if(s.kind === 'keypad'){
    let shown = '';
    if(typed){
      shown = s.len === 13 && typed.length > 6
        ? typed.slice(0, 6) + ' - ' + typed.slice(6)
        : typed;
    }
    const left = s.len - typed.length;
    const ready = typed.length === s.len;
    body = `<h2 class="k-title">${nl(s.title)}</h2>
      ${s.sub ? `<p class="k-sub">${esc(s.sub)}</p>` : ''}
      ${s.practice ? `<div class="practice-num">
        <div class="pn-label">${esc(s.practiceLabel || '연습번호')}</div>
        <div class="pn-value">${esc(s.practice)}</div>
        ${s.warn ? `<div class="pn-warn">${esc(s.warn)}</div>` : ''}
      </div>` : ''}
      <div class="display" id="disp">${shown ? esc(shown) : `<span class="ph">${esc(s.ph || '')}</span>`}</div>
      <p class="k-sub" style="margin-bottom:14px">${ready ? '다 눌렀습니다. 아래 확인을 눌러주세요' : left + '자리 더 눌러주세요'}</p>
      <div class="pad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-key="${n}">${n}</button>`).join('')}
        <button class="key act" data-key="del">지우기</button>
        <button class="key" data-key="0">0</button>
        <button class="key act${ready ? ' hint' : ''}" data-key="ok" ${ready ? '' : 'disabled'}>확인</button>
      </div>`;
  }

  else if(s.kind === 'finger'){
    body = `<h2 class="k-title">${nl(s.title)}</h2>
      ${s.sub ? `<p class="k-sub">${esc(s.sub)}</p>` : ''}
      <div class="finger"><button class="${help ? 'hint' : ''}" data-next="${s.next}"><span class="ring"></span>손가락을 여기에</button></div>`;
  }

  else if(s.kind === 'card'){
    body = `<h2 class="k-title">${nl(s.title)}</h2>
      ${s.sub ? `<p class="k-sub">${esc(s.sub)}</p>` : ''}
      <div class="cardwrap">
        <button class="cardslot hint" data-next="${s.next}">
          <span class="slot-arrow">▼</span>
          <span class="slot-line"></span>
          <span class="slot-text">여기에 카드를 넣고<br>화면을 눌러주세요</span>
        </button>
      </div>`;
  }

  else if(s.kind === 'wait'){
    showAsk = false;
    body = `<div class="waiting">
      <div class="bars"><i></i><i></i><i></i><i></i></div>
      <h2 class="k-title">${nl(s.title)}</h2>
      ${s.sub ? `<p class="k-sub">${esc(s.sub)}</p>` : ''}
    </div>`;
  }

  else if(s.kind === 'done'){
    showAsk = false;
    const num = typeof s.num === 'function' ? s.num(state) : s.num;
    body = `<div class="done">
      <div class="ticket">
        <div class="ticket-label">${esc(s.label)}</div>
        <div class="ticket-num">${esc(num)}</div>
      </div>
      <p class="done-msg">${nl(nx(s.msg))}</p>
      ${verdictHTML(f)}
      <div class="done-btns">
        <button class="opt primary" data-restart="1"><span class="opt-main"><span class="opt-label">한 번 더 해보기</span></span></button>
        <button class="opt ghost" data-home="1"><span class="opt-main"><span class="opt-label">다른 기계 해보기</span></span></button>
      </div>
    </div>`;
  }

  kiosk.innerHTML = head + `<div class="k-body">${body}${showAsk ? askHTML(s, f) : ''}</div>`;
  kiosk.classList.toggle('help', help);

  kiosk.querySelectorAll('[data-next]').forEach(el => {
    el.onclick = () => {
      const before = snap();
      const i = el.dataset.i;
      const opt = (i !== undefined && s.opts) ? s.opts[i] : null;
      if(opt){
        if(opt.set) Object.assign(state, opt.set);
        if(opt.add){
          state.cart = state.cart || [];
          state.cart.push({ name: (state.temp || '') + state.pick, price: state.cost });
          state.temp = '';
        }
        if(opt.reset){ state.cart = []; state.temp = ''; }
      }
      go(el.dataset.next, true, before);
    };
  });

  const askBtn = kiosk.querySelector('[data-ask]');
  if(askBtn) askBtn.onclick = () => openSheet(askBtn.dataset.ask);

  const restart = kiosk.querySelector('[data-restart]');
  if(restart) restart.onclick = () => startFlow(flowKey);
  const goHome = kiosk.querySelector('[data-home]');
  if(goHome) goHome.onclick = home;

  if(s.kind === 'attract'){
    kiosk.querySelector('.attract').onclick = () => go(nx(s.next));
  }

  if(s.kind === 'keypad'){
    kiosk.querySelectorAll('[data-key]').forEach(b => {
      b.onclick = () => {
        const k = b.dataset.key;
        if(k === 'del'){ typed = typed.slice(0, -1); }
        else if(k === 'ok'){ go(nx(s.next)); return; }
        else if(typed.length < s.len){ typed += k; }
        else {
          const d = document.getElementById('disp');
          if(d){ d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
          toast('다 눌렀습니다. 확인을 눌러주세요');
          return;
        }
        render();
      };
    });
  }

  if(s.kind === 'wait'){
    timer = setTimeout(() => go(nx(s.next)), s.ms || 2000);
  }
}

/* ---------- 미션 채점 ---------- */
function verdictHTML(f){
  if(typeof f.review !== 'function') return '';
  const items = f.review(state);
  const pass = items.every(it => it[0]);
  const rows = items.map(it =>
    `<div class="v-item ${it[0] ? 'yes' : 'no'}">
      <span class="v-mark">${it[0] ? '✓' : '!'}</span>
      <span>${esc(it[1])}</span>
    </div>`).join('');
  return `<div class="verdict ${pass ? 'pass' : 'near'}">
    <div class="v-head">${pass ? '미션 성공! 혼자 해내셨어요' : '거의 다 왔어요'}</div>
    ${rows}
  </div>`;
}

/* ---------- AI 물어보기 ---------- */
let curPrompt = '';
function openSheet(text){
  curPrompt = text;
  promptBox.textContent = text;
  sheet.classList.add('on');
}
function closeSheet(){ sheet.classList.remove('on'); }

function copyText(t){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(() => toast('복사했습니다')).catch(() => fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta = document.createElement('textarea');
  ta.value = t;
  ta.style.position = 'fixed'; ta.style.top = '-1000px';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, t.length);
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  toast(ok ? '복사했습니다' : '문장을 길게 눌러 복사해주세요');
}

document.getElementById('btnCopy').onclick = () => copyText(curPrompt);
document.getElementById('btnCloseSheet').onclick = closeSheet;
sheet.onclick = e => { if(e.target === sheet) closeSheet(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

/* ---------- 상단 버튼 ---------- */
btnHelp.onclick = () => {
  help = !help;
  btnHelp.classList.toggle('on', help);
  kiosk.classList.toggle('help', help);
  if(flowKey && cur) render();
};
btnBack.onclick = () => {
  if(!stack.length) return;
  clearTimer();
  const prev = stack.pop();
  cur = prev.id;
  state = prev.st;
  typed = '';
  render();
};
btnHome.onclick = home;

home();
</script>
</body>
</html>
