<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>키오스크 연습기</title>
<style>
  :root{
    --shell-bg:#14161a;
    --shell-panel:#1e2229;
    --shell-line:#333a44;
    --shell-text:#f2f4f7;
    --shell-dim:#9aa4b2;
    --practice:#ffc53d;
    --radius:14px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--shell-bg);
    color:var(--shell-text);
    font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;
    font-size:clamp(18px,1.9vw,21px);
    line-height:1.5;
    -webkit-text-size-adjust:100%;
    overflow-x:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;}

  /* ---------- 연습 프레임 ---------- */
  .shell{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding-bottom:var(--navh);
  }
  :root{--navh:86px;}
  .bar{
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;
    background:var(--shell-panel);
    border-bottom:1px solid var(--shell-line);
    flex-wrap:wrap;
  }
  .tag{
    font-size:.82em;font-weight:800;letter-spacing:.08em;
    color:#14161a;background:var(--practice);
    padding:6px 11px;border-radius:999px;white-space:nowrap;
  }
  .mission{
    flex:1 1 240px;min-width:0;
    font-size:1.02em;color:var(--shell-text);
  }
  .mission b{color:var(--practice);font-weight:800;}

  /* 아래 고정 조작바 — 한 손으로 닿는 자리 */
  .nav{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
    padding:9px 10px calc(9px + env(safe-area-inset-bottom));
    background:var(--shell-panel);
    border-top:2px solid var(--shell-line);
  }
  .bar-btn{
    border:2px solid var(--shell-line);
    background:#262b33;color:var(--shell-text);
    min-height:62px;padding:8px 6px;border-radius:14px;
    font-size:clamp(18px,2.2vw,21px);font-weight:800;white-space:nowrap;
  }
  .bar-btn:active{transform:translateY(1px);}
  .bar-btn.on{background:var(--practice);color:#14161a;border-color:var(--practice);}
  .bar-btn:disabled{opacity:.3;}

  /* 아래에 더 있다는 표시 */
  .more{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(var(--navh) + 10px);z-index:49;
    background:var(--practice);color:#14161a;
    font-size:17px;font-weight:800;
    padding:10px 18px;border-radius:999px;
    box-shadow:0 4px 14px rgba(0,0,0,.3);
    display:none;pointer-events:none;
  }
  .more.show{display:block;}

  .stage{
    flex:1;
    display:flex;align-items:stretch;justify-content:center;
    padding:0;
  }

  /* ---------- 기계 화면 ---------- */
  .kiosk{
    width:100%;
    display:flex;flex-direction:column;
    background:var(--k-bg);
    color:var(--k-text);
    position:relative;
    overflow:hidden;
  }
  .kiosk[data-theme="cafe"]{--k-bg:#33241c;--k-text:#fbf4e8;--k-card:#452f24;--k-line:#5d4133;--k-accent:#d2712f;--k-accent-text:#fff;--k-sub:#d8c3ae;}
  .kiosk[data-theme="clinic"]{--k-bg:#ffffff;--k-text:#0f2c52;--k-card:#f1f6fc;--k-line:#c8dcf2;--k-accent:#1668c4;--k-accent-text:#fff;--k-sub:#4a6688;}
  .kiosk[data-theme="gov"]{--k-bg:#f3f5f1;--k-text:#173d2c;--k-card:#ffffff;--k-line:#c2d2c8;--k-accent:#166b46;--k-accent-text:#fff;--k-sub:#4d6b5c;}
  .kiosk[data-theme="home"]{--k-bg:#14161a;--k-text:#f2f4f7;--k-card:#1e2229;--k-line:#333a44;--k-accent:#ffc53d;--k-accent-text:#14161a;--k-sub:#9aa4b2;}

  .k-head{
    padding:16px 20px;
    border-bottom:2px solid var(--k-line);
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  }
  .k-brand{font-size:1.05em;font-weight:800;letter-spacing:-.01em;}
  .k-step{margin-left:auto;font-size:1em;color:var(--k-sub);font-weight:700;}

  .k-body{
    flex:1;
    padding:clamp(18px,3vw,34px) clamp(16px,4vw,40px) 24px;
    display:flex;flex-direction:column;
    max-width:1000px;width:100%;margin:0 auto;
  }
  .k-title{
    font-size:clamp(26px,4.2vw,44px);
    font-weight:800;line-height:1.25;letter-spacing:-.02em;
    margin:0 0 8px;
  }
  .k-sub{
    font-size:clamp(17px,2vw,22px);
    color:var(--k-sub);margin:0 0 clamp(16px,2.5vw,26px);
  }

  .opts{display:grid;gap:12px;grid-template-columns:1fr;}
  .opts.two{grid-template-columns:1fr;}
  @media (min-width:640px){
    .opts.two{grid-template-columns:1fr 1fr;}
    .opts.grid{grid-template-columns:1fr 1fr;}
  }

  .opt{
    display:flex;align-items:center;gap:14px;
    width:100%;min-height:78px;
    padding:16px 20px;
    background:var(--k-card);
    border:2px solid var(--k-line);
    border-radius:var(--radius);
    text-align:left;
    transition:transform .08s ease, box-shadow .12s ease;
  }
  .opt:active{transform:scale(.985);}
  .opt-main{flex:1;min-width:0;}
  .opt-label{font-size:clamp(20px,2.6vw,28px);font-weight:800;letter-spacing:-.01em;}
  .opt-note{font-size:clamp(17px,1.7vw,19px);color:var(--k-sub);margin-top:3px;}
  .opt-price{font-size:clamp(18px,2.1vw,23px);font-weight:800;white-space:nowrap;}
  .opt.primary{background:var(--k-accent);border-color:var(--k-accent);color:var(--k-accent-text);}
  .opt.primary .opt-note{color:var(--k-accent-text);opacity:.85;}
  .opt.ghost{background:transparent;}

  /* 도움말: 눌러야 할 곳만 밝게 */
  .kiosk.help .opt:not(.hint){opacity:.45;}
  .kiosk.help .opt.hint{
    box-shadow:0 0 0 5px var(--practice);
    position:relative;
  }
  .kiosk.help .opt.hint::after{
    content:'여기';
    position:absolute;right:-6px;top:-14px;
    background:var(--practice);color:#14161a;
    font-size:14px;font-weight:800;
    padding:3px 9px;border-radius:999px;
  }
  @media (prefers-reduced-motion:no-preference){
    .kiosk.help .opt.hint{animation:pulse 1.6s ease-in-out infinite;}
    @keyframes pulse{
      0%,100%{box-shadow:0 0 0 5px var(--practice);}
      50%{box-shadow:0 0 0 10px rgba(255,197,61,.45);}
    }
  }

  /* 시작 화면 */
  .attract{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    text-align:center;padding:30px 10px;
  }
  .attract-title{font-size:clamp(30px,6vw,60px);font-weight:800;letter-spacing:-.03em;}
  .attract-sub{font-size:clamp(18px,2.4vw,26px);color:var(--k-sub);}
  .touch{
    margin-top:10px;
    width:clamp(150px,26vw,220px);height:clamp(150px,26vw,220px);
    border-radius:50%;
    border:5px dashed var(--k-accent);
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(20px,2.6vw,28px);font-weight:800;color:var(--k-accent);
  }
  @media (prefers-reduced-motion:no-preference){
    .touch{animation:breathe 2.4s ease-in-out infinite;}
    @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  }

  /* 숫자판 */
  .display{
    background:var(--k-card);border:2px solid var(--k-line);
    border-radius:var(--radius);
    padding:18px;margin-bottom:16px;
    font-size:clamp(28px,5vw,44px);font-weight:800;
    letter-spacing:.14em;text-align:center;min-height:78px;
    word-break:break-all;
  }
  .display .ph{color:var(--k-sub);letter-spacing:.1em;}
  .display.wide{font-size:clamp(22px,4vw,38px);letter-spacing:.06em;}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .key{
    min-height:66px;
    background:var(--k-card);border:2px solid var(--k-line);
    border-radius:var(--radius);
    font-size:clamp(24px,3.4vw,32px);font-weight:800;
  }
  .key:active{transform:scale(.96);}
  .key.act{background:var(--k-accent);border-color:var(--k-accent);color:var(--k-accent-text);font-size:clamp(19px,2.2vw,24px);}
  .key.del{
    background:transparent;border-color:var(--k-sub);color:var(--k-sub);
    font-size:clamp(19px,2.2vw,24px);
  }
  .key:disabled{opacity:.4;}

  /* 지문 */
  .finger{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:20px 0;
  }
  .finger button{
    width:clamp(170px,30vw,240px);height:clamp(170px,30vw,240px);
    border-radius:28px;
    border:5px solid var(--k-accent);background:var(--k-card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    font-size:clamp(18px,2.2vw,24px);font-weight:800;color:var(--k-accent);
  }
  .finger .ring{
    width:64px;height:64px;border-radius:50%;
    border:5px solid var(--k-accent);border-top-color:transparent;
  }

  /* 확인표 */
  .lines{
    background:var(--k-card);border:2px solid var(--k-line);
    border-radius:var(--radius);overflow:hidden;margin-bottom:18px;
  }
  .line{
    display:flex;justify-content:space-between;gap:14px;
    padding:15px 18px;border-bottom:1px solid var(--k-line);
    font-size:clamp(18px,2.1vw,23px);
  }
  .line:last-child{border-bottom:0;}
  .line span:first-child{color:var(--k-sub);}
  .line span:last-child{font-weight:800;text-align:right;}
  .line.total span{font-size:clamp(20px,2.4vw,26px);font-weight:800;color:var(--k-text);}

  /* 진행중 */
  .waiting{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;gap:20px;text-align:center;
    padding-top:clamp(10px,5vh,50px);
  }
  .waiting .tap{
    margin-top:6px;font-size:clamp(17px,2vw,20px);
    color:var(--k-sub);font-weight:700;
  }
  .bars{display:flex;gap:8px;}
  .bars i{width:14px;height:44px;background:var(--k-accent);border-radius:5px;opacity:.3;}
  @media (prefers-reduced-motion:no-preference){
    .bars i{animation:bounce 1s ease-in-out infinite;}
    .bars i:nth-child(2){animation-delay:.15s;}
    .bars i:nth-child(3){animation-delay:.3s;}
    .bars i:nth-child(4){animation-delay:.45s;}
    @keyframes bounce{0%,100%{opacity:.3;transform:scaleY(.7);}50%{opacity:1;transform:scaleY(1.15);}}
  }

  /* 완료 */
  .done{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;text-align:center;gap:14px;
    padding-top:clamp(6px,3vh,30px);
  }
  .ticket{
    background:var(--k-card);border:3px solid var(--k-accent);
    border-radius:20px;padding:clamp(20px,4vw,34px) clamp(28px,6vw,60px);
  }
  .ticket-label{font-size:clamp(17px,2vw,21px);color:var(--k-sub);margin-bottom:6px;}
  .ticket-num{font-size:clamp(46px,10vw,88px);font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--k-accent);}
  .done-msg{font-size:clamp(19px,2.4vw,26px);font-weight:700;max-width:22em;}
  .done-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
  .done-btns .opt{width:auto;min-height:64px;}

  /* 홈 */
  .home-head{padding:clamp(22px,4vw,38px) clamp(16px,4vw,40px) 6px;max-width:1000px;margin:0 auto;width:100%;}
  .home-title{font-size:clamp(27px,4.4vw,42px);font-weight:800;letter-spacing:-.02em;margin:0 0 8px;}
  .home-sub{font-size:clamp(17px,2vw,21px);color:var(--shell-dim);margin:0;}
  .machines{display:grid;gap:14px;grid-template-columns:1fr;}
  @media (min-width:820px){.machines{grid-template-columns:repeat(3,1fr);}}
  .machine{
    padding:22px;border-radius:18px;border:2px solid var(--shell-line);
    background:var(--shell-panel);text-align:left;
    display:flex;flex-direction:column;gap:8px;min-height:150px;
  }
  .machine:active{transform:scale(.99);}
  .m-kind{font-size:.8em;font-weight:800;letter-spacing:.1em;color:var(--practice);}
  .m-name{font-size:clamp(22px,2.8vw,28px);font-weight:800;}
  .m-goal{font-size:clamp(18px,1.8vw,20px);color:var(--shell-dim);}
  .note{
    margin-top:18px;padding:16px 18px;border-radius:14px;
    border:1px dashed var(--shell-line);color:var(--shell-dim);
    font-size:clamp(17px,1.7vw,19px);
  }
  .note b{color:var(--shell-text);}

  :focus-visible{outline:4px solid var(--practice);outline-offset:3px;}
</style>
</head>
<body>
<div class="shell">
  <div class="bar">
    <span class="tag">연습용</span>
    <div class="mission" id="mission">기계를 하나 고르세요</div>
  </div>
  <div class="stage"><div class="kiosk" id="kiosk" data-theme="home"></div></div>
</div>
<div class="more" id="more">↓ 아래에 더 있어요</div>
<nav class="nav">
  <button class="bar-btn" id="btnHelp" disabled>도움말</button>
  <button class="bar-btn" id="btnBack" disabled>뒤로</button>
  <button class="bar-btn" id="btnHome">처음으로</button>
</nav>

<script>
const FLOWS = {
  cafe: {
    kind: '카페',
    brand: '햇살카페 주문기',
    name: '카페 음료 주문',
    theme: 'cafe',
    goal: '아이스 아메리카노 1잔을 포장으로 주문하고 카드로 결제하기',
    mission: '<b>아이스 아메리카노 1잔</b>을 <b>포장</b>으로 주문하고 <b>카드</b>로 결제하세요',
    start: 'c0',
    steps: 9,
    screens: {
      c0: { kind:'attract', title:'주문하시려면\n화면을 눌러주세요', sub:'이곳은 카드로만 결제됩니다', next:'c1' },
      c1: { kind:'choice', step:1, title:'어디서 드시나요?', sub:'포장을 고르면 뚜껑을 함께 드립니다',
            opts:[ {label:'매장에서 먹고 갈게요', next:'c2', set:{dine:'매장'}},
                   {label:'포장해서 가져갈게요', next:'c2', set:{dine:'포장'}, hint:true} ] },
      c2: { kind:'choice', step:2, title:'무엇을 드시겠어요?', sub:'종류를 먼저 고릅니다', cols:'grid',
            opts:[ {label:'커피', next:'c3', hint:true}, {label:'차', next:'c3t'},
                   {label:'주스', next:'c3j'}, {label:'디저트', next:'c3d'} ] },
      c3: { kind:'choice', step:3, title:'커피', sub:'드실 음료를 눌러주세요',
            opts:[ {label:'아메리카노', price:'2,000원', next:'c4', set:{pick:'아메리카노', cost:2000}, hint:true},
                   {label:'카페라떼', price:'3,000원', next:'c4', set:{pick:'카페라떼', cost:3000}},
                   {label:'카푸치노', price:'3,500원', next:'c4', set:{pick:'카푸치노', cost:3500}},
                   {label:'앞으로 돌아가기', next:'c2', ghost:true} ] },
      c3t: { kind:'choice', step:3, title:'차', sub:'드실 음료를 눌러주세요',
            opts:[ {label:'녹차', price:'2,500원', next:'c4', set:{pick:'녹차', cost:2500}},
                   {label:'유자차', price:'3,000원', next:'c4', set:{pick:'유자차', cost:3000}},
                   {label:'앞으로 돌아가기', next:'c2', ghost:true} ] },
      c3j: { kind:'choice', step:3, title:'주스', sub:'모두 차갑게 나옵니다',
            opts:[ {label:'오렌지주스', price:'4,000원', next:'c5', set:{pick:'오렌지주스', cost:4000}, add:true},
                   {label:'딸기주스', price:'4,500원', next:'c5', set:{pick:'딸기주스', cost:4500}, add:true},
                   {label:'앞으로 돌아가기', next:'c2', ghost:true} ] },
      c3d: { kind:'choice', step:3, title:'디저트', sub:'',
            opts:[ {label:'치즈케이크', price:'5,000원', next:'c5', set:{pick:'치즈케이크', cost:5000}, add:true},
                   {label:'쿠키', price:'2,000원', next:'c5', set:{pick:'쿠키', cost:2000}, add:true},
                   {label:'앞으로 돌아가기', next:'c2', ghost:true} ] },
      c4: { kind:'choice', step:4, title:'따뜻한 것과 차가운 것,\n어느 쪽으로 드릴까요?', sub:'',
            opts:[ {label:'따뜻하게', note:'HOT', next:'c5', set:{temp:'따뜻한 '}, add:true},
                   {label:'차갑게', note:'ICE', next:'c5', set:{temp:'아이스 '}, add:true, hint:true} ] },
      c5: { kind:'confirm', step:5, title:'주문하신 내용입니다', sub:'맞으면 결제하기를 눌러주세요',
            lines: st => {
              const cart = st.cart || [];
              const rows = cart.map(it => [it.name, it.price.toLocaleString() + '원']);
              rows.push(['드시는 방법', st.dine || '매장']);
              rows.push(['총 금액', cart.reduce((a, b) => a + b.price, 0).toLocaleString() + '원']);
              return rows;
            },
            opts:[ {label:'메뉴 더 담기', next:'c2', ghost:true},
                   {label:'처음부터 다시', next:'c1', ghost:true, reset:true},
                   {label:'결제하기', next:'c6', primary:true, hint:true} ] },
      c6: { kind:'choice', step:6, title:'어떻게 결제하시겠어요?', sub:'',
            opts:[ {label:'카드', note:'신용·체크카드', next:'c7', hint:true},
                   {label:'휴대폰 간편결제', note:'삼성페이·애플페이 등', next:'c7'},
                   {label:'쿠폰·기프티콘', note:'바코드를 아래에 대주세요', next:'c7'} ] },
      c7: { kind:'wait', step:7, title:'카드를 넣어주세요', sub:'화살표 방향으로 끝까지 넣으시면 됩니다', next:'c8', ms:4000 },
      c8: { kind:'wait', step:8, title:'결제하는 중입니다', sub:'카드를 빼지 마세요', next:'c9', ms:3500 },
      c9: { kind:'done', step:9, label:'주문번호', num:'A-27',
            msg:'주문이 끝났습니다.\n번호가 불리면 받으러 오세요.' }
    }
  },

  clinic: {
    kind: '병원',
    brand: '늘봄병원 접수기',
    name: '병원 무인 접수',
    theme: 'clinic',
    goal: '생년월일로 본인확인을 하고 내과 진료를 접수하기',
    mission: '<b>내과</b> 진료를 접수하세요. 본인확인은 <b>생년월일</b>로 합니다',
    start: 'h0',
    steps: 8,
    screens: {
      h0: { kind:'attract', title:'화면을 눌러\n접수를 시작하세요', sub:'도움이 필요하면 옆 창구로 오세요', next:'h1' },
      h1: { kind:'choice', step:1, title:'무엇을 하러 오셨어요?', sub:'',
            opts:[ {label:'진료 접수', note:'오늘 진료를 받으러 왔어요', next:'h2', set:{task:'접수'}, hint:true},
                   {label:'진료비 수납', note:'진료를 마치고 돈을 내요', next:'h2', set:{task:'수납'}},
                   {label:'증명서 발급', note:'진단서·영수증을 뽑아요', next:'h2', set:{task:'증명서'}} ] },
      h2: { kind:'choice', step:2, title:'본인 확인을 하겠습니다', sub:'편한 방법을 고르세요',
            opts:[ {label:'생년월일 누르기', note:'숫자 6자리', next:'h3', hint:true},
                   {label:'건강보험증 넣기', note:'아래 투입구에 넣어주세요', next:'h3'} ] },
      h3: { kind:'keypad', step:3, title:'생년월일을 눌러주세요', sub:'1948년 3월 12일이면 480312', len:6, ph:'예) 480312',
            next: st => st.task === '수납' ? 'p1' : st.task === '증명서' ? 'd1' : 'h4' },

      h4: { kind:'choice', step:4, title:'어느 과에서 진료받으세요?', sub:'', cols:'grid',
            opts:[ {label:'내과', next:'h5', set:{dept:'내과', floor:'3층'}, hint:true},
                   {label:'정형외과', next:'h5', set:{dept:'정형외과', floor:'2층'}},
                   {label:'이비인후과', next:'h5', set:{dept:'이비인후과', floor:'2층'}},
                   {label:'안과', next:'h5', set:{dept:'안과', floor:'4층'}} ] },
      h5: { kind:'confirm', step:5, title:'이 내용이 맞습니까?', sub:'',
            lines: st => [ ['성함','홍○○ 님'], ['진료과', st.dept || '내과'], ['오늘 진료','오후 2시 30분'] ],
            opts:[ {label:'아니에요, 다시 할게요', next:'h1', ghost:true},
                   {label:'맞습니다', next:'h6', primary:true, hint:true} ] },
      h6: { kind:'wait', step:6, title:'접수증을 뽑고 있습니다', sub:'잠시만 기다려주세요', next:'h7', ms:3500 },
      h7: { kind:'done', step:7, label:'대기번호', num:'12',
            msg: st => '접수가 끝났습니다.\n' + (st.floor || '3층') + ' ' + (st.dept || '내과') + ' 앞에서 기다려주세요.' },

      p1: { kind:'confirm', step:4, title:'오늘 진료비입니다', sub:'맞으면 결제하기를 눌러주세요',
            lines:[ ['성함','홍○○ 님'], ['진료과','내과'], ['진찰료','9,500원'], ['약 처방전','1건'], ['내실 금액','9,500원'] ],
            opts:[ {label:'창구에서 낼게요', next:'h1', ghost:true},
                   {label:'결제하기', next:'p2', primary:true, hint:true} ] },
      p2: { kind:'choice', step:5, title:'어떻게 결제하시겠어요?', sub:'',
            opts:[ {label:'카드', note:'투입구에 끝까지 넣어주세요', next:'p3', hint:true},
                   {label:'휴대폰 간편결제', note:'삼성페이·애플페이 등', next:'p3'} ] },
      p3: { kind:'wait', step:6, title:'결제하는 중입니다', sub:'카드를 빼지 마세요', next:'p4', ms:3500 },
      p4: { kind:'done', step:7, label:'수납 완료', num:'9,500원',
            msg:'수납이 끝났습니다.\n영수증과 처방전을 챙겨\n1층 약국으로 가세요.' },

      d1: { kind:'choice', step:4, title:'어떤 서류가 필요하세요?', sub:'', cols:'grid',
            opts:[ {label:'진료비 영수증', note:'무료', next:'d2', set:{doc:'진료비 영수증', fee:0}, hint:true},
                   {label:'진료 확인서', note:'1,000원', next:'d2', set:{doc:'진료 확인서', fee:1000}},
                   {label:'진단서', note:'창구에서만 됩니다', next:'d2', set:{doc:'진단서', fee:0}},
                   {label:'처방전 다시 뽑기', note:'무료', next:'d2', set:{doc:'처방전', fee:0}} ] },
      d2: { kind:'confirm', step:5, title:'이 서류가 맞습니까?', sub:'',
            lines: st => [ ['성함','홍○○ 님'], ['서류', st.doc || '진료비 영수증'],
                           ['통수','1통'], ['수수료', (st.fee || 0) === 0 ? '없음' : st.fee.toLocaleString() + '원'] ],
            opts:[ {label:'다시 고를게요', next:'d1', ghost:true},
                   {label:'뽑기', next:'d3', primary:true, hint:true} ] },
      d3: { kind:'wait', step:6, title:'서류를 뽑고 있습니다', sub:'종이가 나올 때까지 기다려주세요', next:'d4', ms:4000 },
      d4: { kind:'done', step:7, label:'발급 완료', num:'1통',
            msg: st => { const d = st.doc || '진료비 영수증';
                         const c = d.charCodeAt(d.length - 1);
                         const j = (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) ? '이' : '가';
                         return d + j + ' 나왔습니다.\n아래 출구에서 가져가세요.'; } }
    }
  },

  gov: {
    kind: '주민센터',
    brand: '무인민원발급기',
    name: '등본·가족관계증명서 뽑기',
    theme: 'gov',
    goal: '주민등록등본 1통을 카드로 결제해 뽑기',
    mission: '<b>주민등록등본 1통</b>을 뽑으세요. 주소는 <b>현재 주소만</b>, 결제는 <b>카드</b>입니다',
    start: 'g0',
    order: ['g0','g1','g2','g3','g4','g5','g6','g7','g8','g9','g10'],
    screens: {
      g0: { kind:'attract', title:'화면을 눌러\n시작하세요', sub:'수수료는 카드와 동전으로 낼 수 있습니다', next:'g1' },
      g1: { kind:'choice', title:'무엇을 하시겠어요?', sub:'',
            opts:[ {label:'증명서 발급', note:'등본·초본·가족관계증명서', next:'g2', hint:true},
                   {label:'발급 내역 확인', next:'g2'},
                   {label:'사용법 안내', next:'g2'} ] },
      g2: { kind:'choice', title:'어떤 서류가 필요하세요?', sub:'', cols:'grid',
            opts:[ {label:'주민등록등본', next:'g3', hint:true}, {label:'주민등록초본', next:'g3'},
                   {label:'가족관계증명서', next:'g3'}, {label:'인감증명서', note:'창구에서만 됩니다', next:'g3'} ] },
      g3: { kind:'keypad', title:'주민등록번호를 눌러주세요', sub:'13자리입니다. 연습이니 아무 숫자나 괜찮습니다', len:13, next:'g4', ph:'예) 000000 - 0000000' },
      g4: { kind:'finger', title:'지문을 대주세요', sub:'네모난 칸에 검지를 3초간 올려두세요', next:'g5' },
      g5: { kind:'choice', title:'주소를 어떻게 표시할까요?', sub:'대부분 현재 주소만으로 충분합니다',
            opts:[ {label:'현재 주소만 표시', note:'가장 많이 쓰는 방법', next:'g6', hint:true},
                   {label:'지난 주소까지 모두 표시', note:'이사한 기록이 다 나옵니다', next:'g6'} ] },
      g6: { kind:'choice', title:'몇 통 뽑으시겠어요?', sub:'한 통에 200원입니다',
            opts:[ {label:'1통', note:'200원', next:'g7', set:{copies:1}, hint:true},
                   {label:'2통', note:'400원', next:'g7', set:{copies:2}},
                   {label:'3통', note:'600원', next:'g7', set:{copies:3}} ] },
      g7: { kind:'confirm', title:'이 내용이 맞습니까?', sub:'맞으면 결제하기를 눌러주세요',
            lines: st => [ ['서류','주민등록등본'], ['통수', (st.copies || 1) + '통'], ['수수료', ((st.copies || 1) * 200).toLocaleString() + '원'] ],
            opts:[ {label:'통수 바꾸기', next:'g6', ghost:true},
                   {label:'결제하기', next:'g8', primary:true, hint:true} ] },
      g8: { kind:'choice', title:'수수료를 내주세요', sub:'',
            opts:[ {label:'카드', note:'투입구에 끝까지 넣어주세요', next:'g9', hint:true},
                   {label:'동전', note:'동전 투입구에 넣어주세요', next:'g9'} ] },
      g9: { kind:'wait', title:'서류를 뽑고 있습니다', sub:'종이가 나올 때까지 기다려주세요', next:'g10', ms:4000 },
      g10: { kind:'done', label:'발급 완료', num: st => (st.copies || 1) + '통',
            msg:'주민등록등본이 나왔습니다.\n아래 출구에서 가져가세요.' }
    }
  }
};

const kiosk = document.getElementById('kiosk');
const missionEl = document.getElementById('mission');
const btnHelp = document.getElementById('btnHelp');
const btnBack = document.getElementById('btnBack');
const btnHome = document.getElementById('btnHome');

let flowKey = null, cur = null, stack = [], help = false, typed = '', timer = null, state = {};

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }

function nx(v){ return typeof v === 'function' ? v(state) : v; }

function clearTimer(){ if(timer){ clearTimeout(timer); timer = null; } }

/* 폰 뒤로가기 대응: 연습 중에는 사이트를 벗어나지 않고 한 화면씩 돌아간다 */
let spare = false;
function armBack(){
  if(spare) return;
  try{ history.pushState({ kiosk: 1 }, ''); spare = true; }catch(e){}
}
function stepBack(){
  clearTimer();
  if(stack.length){ cur = stack.pop(); typed = ''; render(); return true; }
  if(flowKey){ home(); return true; }
  return false;
}
window.addEventListener('popstate', () => { spare = false; stepBack(); });

function go(id, push = true){
  clearTimer();
  if(push && cur) stack.push(cur);
  cur = id; typed = '';
  render();
}

function home(){
  clearTimer();
  flowKey = null; cur = null; stack = []; help = false; typed = ''; state = {};
  kiosk.dataset.theme = 'home';
  kiosk.classList.remove('help');
  missionEl.innerHTML = '기계를 하나 고르세요';
  btnHelp.disabled = true; btnHelp.classList.remove('on');
  btnBack.disabled = true;
  renderHome();
}

function renderHome(){
  const cards = Object.keys(FLOWS).map(k => {
    const f = FLOWS[k];
    return `<button class="machine" data-flow="${k}">
      <span class="m-kind">${esc(f.kind)}</span>
      <span class="m-name">${esc(f.name)}</span>
      <span class="m-goal">${esc(f.goal)}</span>
    </button>`;
  }).join('');

  kiosk.innerHTML = `
    <div class="home-head">
      <h1 class="home-title">키오스크 연습기</h1>
      <p class="home-sub">진짜 기계가 아닙니다. 마음껏 눌러보세요.</p>
    </div>
    <div class="k-body">
      <div class="machines">${cards}</div>
      <div class="note">
        <b>막히면 아래쪽 도움말</b>을 누르세요. 눌러야 할 곳만 밝게 보입니다.<br>
        기계마다 화면이 다릅니다. 그래서 <b>모르는 화면은 사진을 찍어 AI에게 물어보는 것</b>이 가장 빠릅니다.
      </div>
    </div>`;

  kiosk.querySelectorAll('[data-flow]').forEach(b => {
    b.onclick = () => startFlow(b.dataset.flow);
  });
  checkMore();
}

function startFlow(key){
  flowKey = key;
  const f = FLOWS[key];
  stack = []; cur = null; help = false; state = {};
  kiosk.dataset.theme = f.theme;
  kiosk.classList.remove('help');
  missionEl.innerHTML = f.mission;
  btnHelp.disabled = false; btnHelp.classList.remove('on');
  go(f.start, false);
}

function optHTML(o, i){
  const cls = ['opt'];
  if(o.primary) cls.push('primary');
  if(o.ghost) cls.push('ghost');
  if(o.hint) cls.push('hint');
  return `<button class="${cls.join(' ')}" data-next="${o.next}" data-i="${i}">
    <span class="opt-main">
      <span class="opt-label">${esc(o.label)}</span>
      ${o.note ? `<span class="opt-note">${esc(o.note)}</span>` : ''}
    </span>
    ${o.price ? `<span class="opt-price">${esc(o.price)}</span>` : ''}
  </button>`;
}

function render(){
  const f = FLOWS[flowKey];
  const s = f.screens[cur];
  const step = s.step || (f.order ? f.order.indexOf(cur) + 1 : 0);
  const total = f.steps || (f.order ? f.order.length : 0);

  btnBack.disabled = !flowKey;

  let head = `<div class="k-head">
    <span class="k-brand">${esc(f.brand)}</span>
    <span class="k-step">${step} / ${total} 단계</span>
  </div>`;

  let body = '';

  if(s.kind === 'attract'){
    head = '';
    body = `<div class="attract">
      <div class="attract-title">${nl(s.title)}</div>
      <div class="attract-sub">${esc(s.sub || '')}</div>
      <div class="touch">누르기</div>
    </div>`;
  }

  else if(s.kind === 'choice'){
    const cols = s.opts.length === 2 ? 'two' : (s.cols || '');
    body = `<h2 class="k-title">${nl(s.title)}</h2>
      ${s.sub ? `<p class="k-sub">${esc(s.sub)}</p>` : ''}
      <div class="opts ${cols}">${s.opts.map(optHTML).join('')}</div>`;
  }

  else if(s.kind === 'confirm'){
    const lines = typeof s.lines === 'function' ? s.lines(state) : s.lines;
    body = `<h2 class="k-title">${nl(s.title)}</h2>
      ${s.sub ? `<p class="k-sub">${esc(s.sub)}</p>` : ''}
      <div class="lines">${lines.map((l, i) =>
        `<div class="line${i === lines.length - 1 ? ' total' : ''}"><span>${esc(l[0])}</span><span>${esc(l[1])}</span></div>`
      ).join('')}</div>
      <div class="opts ${s.opts.length === 2 ? 'two' : ''}">${s.opts.map(optHTML).join('')}</div>`;
  }

  else if(s.kind === 'keypad'){
    let shown = '';
    if(typed){
      shown = s.len === 13 && typed.length > 6
        ? typed.slice(0, 6) + ' - ' + typed.slice(6)
        : typed;
    }
    body = `<h2 class="k-title">${nl(s.title)}</h2>
      ${s.sub ? `<p class="k-sub">${esc(s.sub)}</p>` : ''}
      <div class="display${s.len === 13 ? ' wide' : ''}">${shown ? esc(shown) : `<span class="ph">${esc(s.ph || '')}</span>`}</div>
      <div class="pad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-key="${n}">${n}</button>`).join('')}
        <button class="key del" data-key="del">지우기</button>
        <button class="key" data-key="0">0</button>
        <button class="key act${typed.length === s.len ? ' hint' : ''}" data-key="ok" ${typed.length === s.len ? '' : 'disabled'}>확인</button>
      </div>`;
  }

  else if(s.kind === 'finger'){
    body = `<h2 class="k-title">${nl(s.title)}</h2>
      ${s.sub ? `<p class="k-sub">${esc(s.sub)}</p>` : ''}
      <div class="finger"><button data-next="${s.next}"><span class="ring"></span>손가락을 여기에</button></div>`;
  }

  else if(s.kind === 'wait'){
    body = `<div class="waiting">
      <div class="bars"><i></i><i></i><i></i><i></i></div>
      <h2 class="k-title">${nl(s.title)}</h2>
      ${s.sub ? `<p class="k-sub">${esc(s.sub)}</p>` : ''}
      <div class="tap">다 읽으셨으면 화면을 눌러주세요</div>
    </div>`;
  }

  else if(s.kind === 'done'){
    const num = typeof s.num === 'function' ? s.num(state) : s.num;
    body = `<div class="done">
      <div class="ticket">
        <div class="ticket-label">${esc(s.label)}</div>
        <div class="ticket-num">${esc(num)}</div>
      </div>
      <p class="done-msg">${nl(nx(s.msg))}</p>
      <div class="done-btns">
        <button class="opt primary" data-restart="1"><span class="opt-main"><span class="opt-label">한 번 더 해보기</span></span></button>
        <button class="opt ghost" data-home="1"><span class="opt-main"><span class="opt-label">다른 기계 해보기</span></span></button>
      </div>
    </div>`;
  }

  kiosk.innerHTML = head + `<div class="k-body">${body}</div>`;
  kiosk.classList.toggle('help', help);

  kiosk.querySelectorAll('[data-next]').forEach(el => {
    el.onclick = () => {
      const i = el.dataset.i;
      const opt = (i !== undefined && s.opts) ? s.opts[i] : null;
      if(opt){
        if(opt.set) Object.assign(state, opt.set);
        if(opt.add){
          state.cart = state.cart || [];
          state.cart.push({ name: (state.temp || '') + state.pick, price: state.cost });
          state.temp = '';
        }
        if(opt.reset){ state.cart = []; state.temp = ''; }
      }
      go(el.dataset.next);
    };
  });
  const restart = kiosk.querySelector('[data-restart]');
  if(restart) restart.onclick = () => startFlow(flowKey);
  const goHome = kiosk.querySelector('[data-home]');
  if(goHome) goHome.onclick = home;

  if(s.kind === 'attract'){
    kiosk.querySelector('.attract').onclick = () => go(nx(s.next));
  }

  if(s.kind === 'keypad'){
    kiosk.querySelectorAll('[data-key]').forEach(b => {
      b.onclick = () => {
        const k = b.dataset.key;
        if(k === 'del') typed = typed.slice(0, -1);
        else if(k === 'ok'){ go(nx(s.next)); return; }
        else if(typed.length < s.len) typed += k;
        render();
      };
    });
  }

  if(s.kind === 'wait'){
    const w = kiosk.querySelector('.waiting');
    if(w) w.onclick = () => go(nx(s.next));
    timer = setTimeout(() => go(nx(s.next)), s.ms || 3500);
  }

  armBack();
  window.scrollTo(0, 0);
  checkMore();
}

/* 화면 밖에 선택지가 더 있으면 알려준다 */
const moreEl = document.getElementById('more');
function checkMore(){
  requestAnimationFrame(() => {
    const left = document.documentElement.scrollHeight - window.innerHeight - window.scrollY;
    moreEl.classList.toggle('show', left > 30);
  });
}
window.addEventListener('scroll', checkMore, { passive: true });
window.addEventListener('resize', checkMore);

btnHelp.onclick = () => {
  help = !help;
  btnHelp.classList.toggle('on', help);
  kiosk.classList.toggle('help', help);
};
btnBack.onclick = () => { if(stack.length || flowKey) stepBack(); };
btnHome.onclick = home;

home();
checkMore();
</script>
</body>
</html>
